[supervisord]
nodaemon=true
user=root

[program:backend]
command=/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 3001
directory=/backend
autostart=true
autorestart=true
environment=PORT=3001
stderr_logfile=/var/log/backend/error.log
stdout_logfile=/var/log/backend/access.log

[program:frontend]
command=node /app/server.js
directory=/app
autostart=true
autorestart=true
environment=PORT=3000,HOSTNAME=0.0.0.0,NODE_ENV=production
stderr_logfile=/var/log/frontend/error.log
stdout_logfile=/var/log/frontend/access.log

